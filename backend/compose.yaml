# RELIF backend at home. Easiest: `relif deploy backend` from the repo root (reads relif.yaml: deploy.backend picks
# docker or docker+tailscale, backend.bind's port is published on 127.0.0.1). By hand, from backend/:
# `docker compose up -d --build` (first time: `docker compose run --rm relif init`).
# relif.yaml is mounted read-only; the container's own RELIF_HOME (/data) and --host 0.0.0.0 win over it.
services:
  relif:
    build:
      context: .
      args:
        UID: ${RELIF_UID:-1000}
        GID: ${RELIF_GID:-1000}
    image: ${RELIF_IMAGE:-relif:local}   # relif.yaml deploy.backend_image → pulls CI's GHCR image instead of building
    restart: unless-stopped
    environment:
      RELIF_PUBLIC_URL: ${RELIF_PUBLIC_URL:-}
      RELIF_CONFIG: /etc/relif/relif.yaml
    volumes:
      - ${RELIF_HOME:-~/.relif}:/data
      - ${RELIF_CONFIG_FILE:-../relif.yaml}:/etc/relif/relif.yaml:ro
    ports:
      - "127.0.0.1:${RELIF_PORT:-8765}:8765"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]   # runs as your uid; no-new-privileges is left out: it breaks exec on snap Docker
