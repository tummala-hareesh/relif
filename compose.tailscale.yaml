# Opt-in Tailscale sidecar: the server becomes its own tailnet node `relif` with a real HTTPS certificate at
# https://relif.<tailnet>.ts.net. Only devices on your tailnet can reach it (this is `serve`, not `funnel`),
# and no host port is published at all. Needs TS_AUTHKEY and RELIF_PUBLIC_URL in .env (see .env.example).
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d --build
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: relif
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro

  relif:
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      RELIF_PUBLIC_URL: ${RELIF_PUBLIC_URL:?set RELIF_PUBLIC_URL in .env, e.g. https://relif.<tailnet>.ts.net}
    ports: !reset []

volumes:
  tailscale-state:
