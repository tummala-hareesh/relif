# Builds the static "try the verdict" demo (stlite) and publishes it to the public tummala-hareesh/relif-demo
# repo, whose GitHub Pages serves https://tummala-hareesh.github.io/relif-demo/ from its gh-pages branch.
# This repo stays private: only the built site (index.html + .nojekyll) leaves it, and that page already embeds
# relif/verdict.py, relif/demo.py and demo/app.py. Nothing from the ledger ships.
# Runs only on a demo tag (e.g. `git tag demo-v0.1.0 && git push origin demo-v0.1.0`) or by hand.
# One-time setup: an ed25519 deploy key with write access on relif-demo; its private half is the Actions secret
# DEMO_DEPLOY_KEY here. Pages on relif-demo: Source = deploy from branch gh-pages / (root).
name: demo-pages

on:
  push:
    tags: ["demo-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (golden CLI/page table included)
        run: python3 -m unittest discover -s tests
      - name: Build site
        run: python3 -m relif.demo build --out site
      - name: Publish site to relif-demo (gh-pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          deploy_key: ${{ secrets.DEMO_DEPLOY_KEY }}
          external_repository: tummala-hareesh/relif-demo
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          commit_message: "Deploy demo from ${{ github.ref_name }}"
