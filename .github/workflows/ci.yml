# CI/CD for RELIF (issue #12). Every push to main and every PR:
#   test      unit tests on Python 3.10 + 3.13
#   frontend  the static "is it deductible?" page → Vercel (main: production, PRs: preview), after tests pass.
#             Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (from `vercel link` → .vercel/project.json);
#             without them the job skips with a notice. Posts a "Vercel" commit status (agent-megastar reads it).
#   backend   main only: builds backend/ into ghcr.io/tummala-hareesh/relif-backend:{latest,<sha>}.
#             The ledger never runs in the cloud: `relif deploy backend` on your machine pulls this image.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install "pyyaml>=6"   # backend/pyproject.toml's only dependency (relif.yaml loader)
      - run: python3 -m unittest discover -s tests -t . -v

  frontend:
    needs: test
    # forks' PRs get no secrets: don't try
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # vercel build runs frontend/build.py (stdlib only) on this runner
      - id: setup
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not set yet: skipping the frontend deploy (see the header of ci.yml)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            npm install --global vercel@59.0.0
          fi
      - id: deploy
        if: steps.setup.outputs.ready == 'true'
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            target=production; prod=--prod
          else
            target=preview; prod=
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=Vercel \
            -f description="Deploying ($target)" >/dev/null
          vercel pull --yes --environment="$target" --token="$VERCEL_TOKEN"
          vercel build $prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt $prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "▲ $target: $url" >> "$GITHUB_STEP_SUMMARY"
      - if: success() && steps.deploy.outcome == 'success'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TARGET: ${{ steps.deploy.outputs.target }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=Vercel \
            -f target_url="$URL" -f description="Deployment has completed ($TARGET)" >/dev/null
      - if: failure() && steps.setup.outputs.ready == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=failure -f context=Vercel \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Vercel deployment failed" >/dev/null

  backend:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: |
            UID=1000
            GID=1000
          tags: |
            ghcr.io/tummala-hareesh/relif-backend:latest
            ghcr.io/tummala-hareesh/relif-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=RELIF backend (ledger + capture server); runs on your own machine
          cache-from: type=gha
          cache-to: type=gha,mode=max
