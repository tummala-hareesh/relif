name: test
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install "pyyaml>=6"   # backend/pyproject.toml's only dependency (relif.yaml loader)
      - run: python3 -m unittest discover -s tests -t . -v
