[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relif"
version = "0.1.0"
description = "Local-first, tamper-evident 6-year ledger for rental expense logs and receipts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
relif = "relif.cli:main_exit"

[tool.setuptools]
packages = ["relif"]
